<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Engineering Workshop — v0.1</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2e;--line:#293650;--text:#edf3ff;--muted:#9aa9c4;--accent:#61d5c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}.top{padding:10px 12px;background:#10172a;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:800;font-size:15px}.sub{color:var(--muted);font-size:11px;margin-top:2px}.status{font-size:11px;color:var(--accent)}
.toolbar{display:flex;gap:7px;padding:9px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}.btn{flex:0 0 auto;border:1px solid #35435f;background:#202b42;color:var(--text);padding:9px 11px;border-radius:10px;font-weight:650;font-size:12px;min-height:38px}.btn:active{transform:scale(.98)}.btn.primary{background:var(--accent);color:#07151a;border-color:var(--accent)}
#viewport{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;top:10px;left:10px;right:10px;pointer-events:none;color:#c2cde2;font-size:11px;background:#0b1020c9;border:1px solid #293650;border-radius:9px;padding:8px 10px;max-width:440px}
.bottom{display:flex;gap:8px;padding:8px;background:var(--panel);border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}.bottom label{font-size:11px;color:var(--muted)}select,input{background:#0c1426;border:1px solid #35435f;color:var(--text);border-radius:8px;padding:8px;max-width:100%}#selectedName{color:var(--accent);font-weight:700;min-width:75px}.small{font-size:11px;color:var(--muted)}
@media(min-width:700px){.toolbar{flex-wrap:wrap}.btn{font-size:13px}#hint{font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}</script>
</head>
<body><div id="app">
<header class="top"><div><div class="brand">⚙️ 3D Engineering Workshop</div><div class="sub">Prototype v0.1 · Build ideas before buying parts</div></div><div class="status" id="status">Ready</div></header>
<nav class="toolbar" aria-label="Parts library">
<button class="btn primary" data-shape="box">＋ Cube</button><button class="btn" data-shape="cylinder">＋ Cylinder</button><button class="btn" data-shape="sphere">＋ Sphere</button><button class="btn" data-shape="shaft">＋ Shaft</button><button class="btn" data-shape="gear">＋ Gear</button><button class="btn" id="duplicate">Duplicate</button><button class="btn" id="delete">Delete</button>
</nav>
<main id="viewport"><div id="hint">Tap a part to select it. Drag the coloured arrows to move it. Use the bottom controls to rotate or resize. Pinch to zoom; drag empty space to orbit.</div></main>
<footer class="bottom"><span id="selectedName">No selection</span><label>Tool <select id="mode"><option value="translate">Move</option><option value="rotate">Rotate</option><option value="scale">Scale</option></select></label><label>Colour <input id="colour" type="color" value="#61d5c7" aria-label="Part colour"></label><button class="btn" id="save">Save</button><button class="btn" id="load">Load</button><button class="btn" id="resetView">Reset view</button><span class="small">Saved on this device</span></footer>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
const viewport=document.querySelector('#viewport'), statusEl=document.querySelector('#status');
const scene=new THREE.Scene(); scene.background=new THREE.Color('#0b1020');
const camera=new THREE.PerspectiveCamera(48,1,.1,1000); camera.position.set(7,7,9);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.outputColorSpace=THREE.SRGBColorSpace; viewport.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement); orbit.enableDamping=true; orbit.target.set(0,1,0); orbit.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xc9e2ff,0x263044,2)); const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(5,10,7);key.castShadow=true;scene.add(key);
const grid=new THREE.GridHelper(24,24,'#426078','#243247');grid.position.y=-.015;scene.add(grid);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#0b1020',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;floor.receiveShadow=true;scene.add(floor);
const transform=new TransformControls(camera,renderer.domElement);transform.setSize(.8);scene.add(transform.getHelper());transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);transform.addEventListener('objectChange',()=>{if(selected) updateSelected();});
let parts=[],selected=null,nextId=1;
const materials=colour=>new THREE.MeshStandardMaterial({color:colour,metalness:.25,roughness:.38});
function gearGeometry(teeth=12,r=.85,inner=.24,thickness=.22){const s=new THREE.Shape();for(let i=0;i<teeth*4;i++){const a=i/(teeth*4)*Math.PI*2;let rr=r;if(i%4===1||i%4===2)rr=r*1.12;if(i%4===0)rr=r*.88;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)s.moveTo(x,y);else s.lineTo(x,y)}s.closePath();const hole=new THREE.Path();hole.absarc(0,0,inner,0,Math.PI*2,true);s.holes.push(hole);return new THREE.ExtrudeGeometry(s,{depth:thickness,bevelEnabled:true,bevelSegments:1,steps:1,bevelSize:.035,bevelThickness:.025,curveSegments:8});}
function makeGeometry(type){switch(type){case'box':return new THREE.BoxGeometry(1.3,1.3,1.3);case'cylinder':return new THREE.CylinderGeometry(.65,.65,.35,32);case'sphere':return new THREE.SphereGeometry(.68,24,16);case'shaft':return new THREE.CylinderGeometry(.13,.13,2.1,20);case'gear':return gearGeometry();default:return new THREE.BoxGeometry(1,1,1)}}
function addPart(type,restore={}){const name=restore.name||({box:'Cube',cylinder:'Cylinder',sphere:'Sphere',shaft:'Shaft',gear:'Gear'}[type]||'Part');const mesh=new THREE.Mesh(makeGeometry(type),materials(restore.colour||document.querySelector('#colour').value));mesh.name=name+' '+nextId++;mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData.partType=type;mesh.position.set(...(restore.position||[parts.length%4-1.5,.7,Math.floor(parts.length/4)-1));mesh.rotation.set(...(restore.rotation||[0,0,0]));mesh.scale.set(...(restore.scale||[1,1,1]));scene.add(mesh);parts.push(mesh);select(mesh);statusEl.textContent='Part added';return mesh;}
function select(obj){selected=obj;transform.detach();if(obj)transform.attach(obj);document.querySelector('#selectedName').textContent=obj?obj.name:'No selection';document.querySelector('#colour').value=obj?'#'+obj.material.color.getHexString():'#61d5c7';updateSelected();}
function updateSelected(){if(selected){document.querySelector('#selectedName').textContent=selected.name;}}
document.querySelectorAll('[data-shape]').forEach(b=>b.addEventListener('click',()=>addPart(b.dataset.shape)));
document.querySelector('#mode').addEventListener('change',e=>transform.setMode(e.target.value));
document.querySelector('#colour').addEventListener('input',e=>{if(selected)selected.material.color.set(e.target.value)});
document.querySelector('#delete').addEventListener('click',()=>{if(!selected)return;scene.remove(selected);parts=parts.filter(p=>p!==selected);select(null);statusEl.textContent='Part deleted'});
document.querySelector('#duplicate').addEventListener('click',()=>{if(!selected)return;const old=selected;const copy=addPart(old.userData.partType,{colour:'#'+old.material.color.getHexString(),position:[old.position.x+.5,old.position.y+.3,old.position.z+.5],rotation:[old.rotation.x,old.rotation.y,old.rotation.z],scale:[old.scale.x,old.scale.y,old.scale.z]});copy.name=old.name+' copy';updateSelected()});
function snapshot(){return {version:1,parts:parts.map(p=>({type:p.userData.partType,name:p.name,colour:'#'+p.material.color.getHexString(),position:p.position.toArray(),rotation:[p.rotation.x,p.rotation.y,p.rotation.z],scale:p.scale.toArray()}))}}
document.querySelector('#save').addEventListener('click',()=>{try{localStorage.setItem('engineeringWorkshopProject',JSON.stringify(snapshot()));statusEl.textContent='Project saved ✓'}catch(e){statusEl.textContent='Save failed'}});
document.querySelector('#load').addEventListener('click',()=>{try{const data=JSON.parse(localStorage.getItem('engineeringWorkshopProject')||'null');if(!data){statusEl.textContent='No saved project yet';return}parts.forEach(p=>scene.remove(p));parts=[];select(null);data.parts.forEach(p=>addPart(p.type,p));statusEl.textContent='Project loaded ✓'}catch(e){statusEl.textContent='Could not load project'}});
document.querySelector('#resetView').addEventListener('click',()=>{camera.position.set(7,7,9);orbit.target.set(0,1,0);orbit.update();statusEl.textContent='View reset'});
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(transform.dragging||Math.hypot(e.clientX-downX,e.clientY-downY)>5)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(parts,false);if(hits.length)select(hits[0].object);else if(!transform.axis)select(null)});
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}window.addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();
// Start with a small example assembly so the workspace is not empty.
const base=addPart('box',{colour:'#52647e',position:[0,.25,0],scale:[3,.35,2]});base.name='Base plate';const shaft=addPart('shaft',{colour:'#d9e2f2',position:[0,1.35,0]});shaft.name='Example shaft';const gear=addPart('gear',{colour:'#f4ad55',position:[0,2.15,0],rotation:[Math.PI/2,0,0]});gear.name='Example gear';select(null);statusEl.textContent='Workspace ready';
</script></body></html>
